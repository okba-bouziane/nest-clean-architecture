services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clean
      POSTGRES_PASSWORD: clean
      POSTGRES_DB: clean_tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clean -d clean_tasks"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8
    # 27018 on the host so it does not clash with a local mongod on 27017
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # The clean-tasks realm (client, roles and demo users) is imported on start
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/clean-tasks-realm.json:/opt/keycloak/data/import/clean-tasks-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      retries: 30

volumes:
  postgres-data:
  mongo-data:
